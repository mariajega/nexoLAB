const dateISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateObj = s => s ? new Date(s.length===10?s+'T12:00:00':s) : null;
const fmtDate = (s,opts={day:'numeric',month:'short'}) => { const d=dateObj(s); return d&&!isNaN(d)?new Intl.DateTimeFormat('es-ES',opts).format(d):'Sin fecha'; };

function openDB(){if(!('indexedDB'in window))return Promise.resolve(null);if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});return dbPromise;}
async function loadState(){try{const db=await openDB();if(db){const val=await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const q=tx.objectStore(DB_STORE).get('state');q.onsuccess=()=>res(q.result?.value||null);q.onerror=()=>rej(q.error);});if(val){S=normalizeState(val);return;}}}catch(e){console.warn('IndexedDB no disponible',e);}try{const raw=localStorage.getItem('nexolab-state');if(raw)S=normalizeState(JSON.parse(raw));}catch(e){console.warn(e);}}
function normalizeState(v){const d=initialState();const out={...d,...v,settings:{...d.settings,...(v.settings||{})},meta:{...d.meta,...(v.meta||{})}};for(const k of ['projects','tasks','followups','events','notes'])if(!Array.isArray(out[k]))out[k]=d[k];if(!out.projects.length)out.projects=d.projects;const palette={work:{old:'#ff927c',next:'#2457A6'},raditest:{old:'#b6a4ff',next:'#0D8587'},master:{old:'#8ab8ff',next:'#6558A6'}};out.projects=out.projects.map(p=>{const m=palette[p.id];return m&&p.color===m.old?{...p,color:m.next}:p;});return out;}
async function persist(sync=true){S.updatedAt=nowISO();clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{const db=await openDB();if(db)await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put({id:'state',value:S});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});else localStorage.setItem('nexolab-state',JSON.stringify(S));}catch(e){console.error(e);toast('No se pudo guardar localmente. Exporta una copia de seguridad.','error');}updateStorageStatus();if(sync)scheduleDriveSync();},180);}
function updateStorageStatus(){const el=$('#storageLabel');if(el)el.textContent=S.settings.driveAuto?(driveToken&&Date.now()<driveTokenExp?'Drive · sincronización activa':'Drive · renovar acceso'):'Guardado en este dispositivo';}
function live(arr){return (S[arr]||[]).filter(x=>!x.deletedAt);}
function byUpdated(a,b){return String(a.updatedAt||a.createdAt||'').localeCompare(String(b.updatedAt||b.createdAt||''));}
function proj(id){return S.projects.find(p=>p.id===id)||{name:'Sin área',short:'Sin área',icon:'•',color:'#9ca3b8',areas:[]};}
function visibleTasks(){return live('tasks');}function visibleFollowups(){return live('followups').filter(x=>x.status!=='closed');}function visibleEvents(){return live('events');}
function taskDue(t){return t.dueDate||t.plannedDate||'';}
function isOverdue(t){return t.status!=='done'&&taskDue(t)&&taskDue(t)<todayISO();}
function dueToday(t){return t.status!=='done'&&taskDue(t)===todayISO();}
function reviewOverdue(f){return f.status!=='closed'&&f.reviewDate&&f.reviewDate<todayISO();}
function needsReview(f){return f.status!=='closed'&&f.reviewDate&&f.reviewDate<=todayISO();}
function eventDate(e){return e.start?dateISO(new Date(e.start)):'';}
function expandEvents(fromDate,toDate){const out=[];for(const e of visibleEvents()){const base=new Date(e.start);if(isNaN(base))continue;const day=new Date(base);let guard=0;while(dateISO(day)<=toDate&&guard<500){const current=dateISO(day);if(current>=fromDate){const start=new Date(day);start.setHours(base.getHours(),base.getMinutes(),base.getSeconds(),0);out.push({...e,start:start.toISOString(),occurrenceDate:dateISO(start)});}if(!e.repeat||e.repeat==='none')break;if(e.repeat==='weekly')day.setDate(day.getDate()+7);else if(e.repeat==='monthly'){const y=day.getFullYear(),m=day.getMonth()+1,target=base.getDate();const last=new Date(y,m+1,0).getDate();day.setFullYear(y,m,Math.min(target,last));}else if(e.repeat==='yearly'){const y=day.getFullYear()+1,m=base.getMonth(),target=base.getDate();const last=new Date(y,m+1,0).getDate();day.setFullYear(y,m,Math.min(target,last));}else break;guard++;}}return out.sort((a,b)=>a.start.localeCompare(b.start));}
function nextEvents(limit=5){return expandEvents(todayISO(),addDays(todayISO(),60)).slice(0,limit);} 
function completedThisWeek(){const d=new Date();const wd=(d.getDay()+6)%7;const monday=new Date(d);monday.setDate(d.getDate()-wd);monday.setHours(0,0,0,0);return visibleTasks().filter(t=>t.status==='done'&&new Date(t.completedAt||t.updatedAt)>=monday).length;}
function taskCounts(){const all=visibleTasks();return {open:all.filter(t=>t.status!=='done').length,doing:all.filter(t=>t.status==='doing').length,done:all.filter(t=>t.status==='done').length,overdue:all.filter(isOverdue).length,today:all.filter(dueToday).length};}
function projectCount(id){const tasks=visibleTasks().filter(t=>t.projectId===id&&t.status!=='done');const total=visibleTasks().filter(t=>t.projectId===id).length;return {open:tasks.length,total,done:total-tasks.length,follow:visibleFollowups().filter(f=>f.projectId===id).length};}
function toast(msg,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toastArea').append(el);setTimeout(()=>el.remove(),3500);}
function setView(v){if(v!=='projectDetail'){currentProjectId='work';currentArea='';}currentView=v;render();$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#searchResults').classList.remove('open');$('#globalSearch').value='';window.scrollTo({top:0,behavior:'smooth'});}
function setTheme(theme){S.settings.theme=theme;document.documentElement.dataset.theme=theme;const meta=$('meta[name="theme-color"]');if(meta)meta.content=theme==='dark'?'#101D18':'#F3F5EF';$('#themeBtn').textContent=theme==='dark'?'☼':'☾';persist(false);}

function pageHead(eyebrow,title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><div class="page-sub">${sub}</div></div><div class="head-actions">${actions}</div></div>`;}

function empty(title,sub,icon='✧',action=''){return `<div class="empty"><div class="empty-icon">${icon}</div><strong>${title}</strong>${sub}${action?`<div style="margin-top:12px">${action}</div>`:''}</div>`;}
function projectPill(id){const p=proj(id);return `<span class="pill" style="color:${p.color}">${esc(p.short||p.name)}</span>`;}

function taskCard(t,options={}){const p=proj(t.projectId),over=isOverdue(t),done=t.status==='done';return `<div class="item-card" data-task-card="${t.id}"><button class="check-circle ${done?'done':''}" data-task-toggle="${t.id}" title="${done?'Reabrir':'Completar'}">${done?'✓':''}</button><div class="item-main"><div class="item-title ${done?'muted-strike':''}">${esc(t.title)}</div><div class="item-meta">${projectPill(t.projectId)}${t.area?`<span>${esc(t.area)}</span>`:''}${taskDue(t)?datePill(taskDue(t),over):'<span>Sin fecha</span>'}<span class="pill ${priorityClass(t.priority)}">${priorityLabel(t.priority)}</span>${t.status==='doing'?'<span class="pill vio">En curso</span>':''}</div>${t.checklist?.length?`<div class="subtask-list">${t.checklist.map((c,i)=>`<label><input type="checkbox" data-task-checklist="${i}" data-task-id="${t.id}" ${c.done?'checked':''}><span class="${c.done?'muted-strike':''}">${esc(c.text)}</span></label>`).join('')}</div>`:''}</div><div class="item-actions"><button class="tiny-btn" data-edit-task="${t.id}" title="Editar">✎</button></div></div>`;}
function eventCard(e){return `<div class="item-card" data-event-card="${e.id}"><div class="quick-ico" style="color:var(--vio)">▦</div><div class="item-main"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${projectPill(e.projectId)}${e.area?`<span>${esc(e.area)}</span>`:''}<span>${fmtDate(e.start,{weekday:'short',day:'numeric',month:'short'})} · ${fmtTime(e.start)}${e.end?'–'+fmtTime(e.end):''}</span></div></div><button class="tiny-btn" data-edit-event="${e.id}">✎</button></div>`;}
function followCard(f){const age=daysBetween(f.since||(f.createdAt?dateISO(new Date(f.createdAt)):todayISO()));const over=reviewOverdue(f);const p=proj(f.projectId);return `<article class="followup-card" style="--follow-color:${over?'var(--bad)':p.color}"><div class="follow-head"><div class="item-main"><div class="item-title">${esc(f.title)}</div><div class="item-meta">${projectPill(f.projectId)}${f.area?`<span>${esc(f.area)}</span>`:''}<span class="pill ${over?'bad':'medium'}">${over?'Revisión atrasada':f.kind==='waiting'?'Esperando':'En vigilancia'}</span></div></div><div class="age-bubble"><div class="age-num mono">${age}</div><div class="age-label">días abierto</div></div></div><div class="follow-details">${f.waitingFor?`<b>Depende de:</b> ${esc(f.waitingFor)} · `:''}${f.details?esc(f.details):'Sin descripción adicional.'}</div><div class="follow-footer"><div class="item-meta">${f.reviewDate?`<span class="${over?'text-overdue':''}">Revisar: ${fmtDate(f.reviewDate)}</span>`:''}${f.expectedDate?`<span>Previsto: ${fmtDate(f.expectedDate)}</span>`:''}</div><div class="follow-actions"><button class="btn small" data-follow-update="${f.id}">＋ Actualizar</button><button class="tiny-btn" data-edit-follow="${f.id}">✎</button></div></div></article>`;}
function renderDashboard(){const tc=taskCounts(),fups=visibleFollowups(),review=fups.filter(needsReview).sort((a,b)=>(a.reviewDate||'').localeCompare(b.reviewDate||''));const tasks=visibleTasks().filter(t=>t.status!=='done'&&(dueToday(t)||isOverdue(t)||(!taskDue(t)&&t.priority==='high'))).sort((a,b)=>(taskDue(a)||'9999').localeCompare(taskDue(b)||'9999'));const upcoming=nextEvents(4);const next7=visibleTasks().filter(t=>t.status!=='done'&&taskDue(t)>todayISO()&&taskDue(t)<=addDays(todayISO(),7)).sort((a,b)=>taskDue(a).localeCompare(taskDue(b))).slice(0,5);const activeProjects=S.projects.filter(p=>!p.deletedAt);
return `${pageHead('Tu centro de mando','Hoy, con todo bajo control.',`${new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}. Una visión clara de lo que requiere tu atención.`,`<button class="btn" data-add="event">▦ Evento</button><button class="btn primary" data-add="task">＋ Nueva tarea</button>`)}
<div class="grid stats-grid">${stat('Para hoy',tc.today,'Tareas con fecha de hoy','◷','var(--acc)')}${stat('Vencidas',tc.overdue,'Necesitan una decisión','!','var(--bad)')}${stat('A revisar',review.length,'Seguimientos con revisión pendiente','◎','var(--warn)')}${stat('Próximos eventos',upcoming.length,'En tu agenda','▦','var(--vio)')}</div>

function projectCard(p){const c=projectCount(p.id),pct=c.total?Math.round(c.done/c.total*100):0;return `<article class="project-card" data-project-open="${p.id}" style="--project-color:${p.color};--project-bg:color-mix(in srgb,${p.color} 16%,var(--card2))"><div class="project-top"><div class="project-icon">${p.icon||'◫'}</div><span class="pill">${c.open} abiertas</span></div><div class="project-name">${esc(p.name)}</div><div class="project-desc">${esc(p.desc||'Espacio de trabajo')}</div>${p.id==='raditest'?`<div class="area-grid">${p.areas.map(a=>`<button class="area-chip" data-area-open="${esc(a)}" data-area-project="${p.id}">${esc(a)}</button>`).join('')}</div>`:''}<div class="progress"><span style="width:${pct}%"></span></div><div class="project-foot"><span>${c.done}/${c.total} tareas completadas</span><span>${c.follow} seguimientos</span></div></article>`;}
function renderProjects(){const active=S.projects.filter(p=>!p.deletedAt);return `${pageHead('Espacios','Áreas y proyectos','Organiza el trabajo por contexto. Cada área mantiene sus tareas, reuniones, seguimientos y notas.','<button class="btn primary" data-add="project">＋ Nueva área</button>')}<div class="grid project-grid">${active.map(projectCard).join('')}</div><section class="section-card" style="margin-top:17px"><div class="section-head"><div><h2 class="section-title">Vista consolidada</h2><div class="section-note">Carga abierta y seguimientos por espacio.</div></div></div><div class="stack">${active.map(p=>{const c=projectCount(p.id),f=visibleFollowups().filter(x=>x.projectId===p.id);return `<div class="item-card"><div class="project-icon" style="background:color-mix(in srgb,${p.color} 17%,var(--card2))">${p.icon}</div><div class="item-main"><div class="item-title">${esc(p.name)}</div><div class="item-meta"><span>${c.open} tareas abiertas</span><span>${f.length} seguimientos</span><span>${visibleEvents().filter(e=>e.projectId===p.id&&eventDate(e)>=todayISO()).length} eventos futuros</span></div></div><button class="btn small" data-project-open="${p.id}">Abrir espacio</button></div>`}).join('')}</div></section>`;}
function renderTasks(){let arr=visibleTasks().filter(t=>(taskView==='board'||S.settings.showCompleted||t.status!=='done'||taskFilter==='done')&&(projectFilter==='all'||t.projectId===projectFilter));if(taskFilter==='open')arr=arr.filter(t=>t.status!=='done');if(taskFilter==='today')arr=arr.filter(dueToday);if(taskFilter==='overdue')arr=arr.filter(isOverdue);if(taskFilter==='done')arr=arr.filter(t=>t.status==='done');arr.sort((a,b)=>{const da=taskDue(a)||'9999',db=taskDue(b)||'9999';return (isOverdue(b)-isOverdue(a))||da.localeCompare(db)||({high:0,medium:1,low:2}[a.priority]??1)-({high:0,medium:1,low:2}[b.priority]??1)});
const filters=`<div class="filters"><input class="control filter-search" id="taskSearch" placeholder="Filtrar tareas…"><select class="control" id="projectFilter"><option value="all">Todas las áreas</option>${S.projects.filter(p=>!p.deletedAt).map(p=>`<option value="${p.id}" ${projectFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="segmented"><button data-task-filter="all" class="${taskFilter==='all'?'active':''}">Todas</button><button data-task-filter="open" class="${taskFilter==='open'?'active':''}">Abiertas</button><button data-task-filter="today" class="${taskFilter==='today'?'active':''}">Hoy</button><button data-task-filter="overdue" class="${taskFilter==='overdue'?'active':''}">Vencidas</button></div><div class="segmented"><button data-task-view="list" class="${taskView==='list'?'active':''}">☷ Lista</button><button data-task-view="board" class="${taskView==='board'?'active':''}">▥ Tablero</button></div></div>`;

function calendarItems(fromDate,toDate){
 const items=[
  ...expandEvents(fromDate,toDate).map(e=>({type:'event',date:eventDate(e),sort:e.start,title:e.title,ref:e})),
  ...visibleTasks().filter(t=>t.status!=='done'&&taskDue(t)>=fromDate&&taskDue(t)<=toDate).map(t=>({type:'task',date:taskDue(t),sort:taskDue(t)+'T23:59:00',title:t.title,ref:t})),
  ...visibleFollowups().filter(f=>f.reviewDate&&f.reviewDate>=fromDate&&f.reviewDate<=toDate).map(f=>({type:'follow',date:f.reviewDate,sort:f.reviewDate+'T23:59:00',title:f.title,ref:f}))
 ];
 const order={event:0,task:1,follow:2};return items.sort((a,b)=>a.date.localeCompare(b.date)||a.sort.localeCompare(b.sort)||order[a.type]-order[b.type]);
}
function calendarEntry(x){return x.type==='event'?eventCard(x.ref):x.type==='task'?taskCard(x.ref):followCard(x.ref);}
function calendarDayGroup(day,items,compact=false){const found=items.filter(x=>x.date===day);const d=dateObj(day);return `<section class="section-card calendar-day-group ${day===todayISO()?'is-today':''}"><div class="calendar-day-head"><div><div class="calendar-day-name">${new Intl.DateTimeFormat('es-ES',{weekday:'long'}).format(d)}</div><div class="calendar-day-date">${fmtDate(day,{day:'numeric',month:'long',year:'numeric'})}</div></div><span class="pill ${day===todayISO()?'info':''}">${found.length} ${found.length===1?'elemento':'elementos'}</span></div><div class="stack">${found.length?found.map(calendarEntry).join(''):compact?'<div class="calendar-empty">Sin compromisos</div>':empty('Día sin elementos','No hay tareas, eventos ni revisiones en esta fecha.','◷','<button class="btn small" data-add="event" data-prefill-date="'+day+'">＋ Añadir al día</button>')}</div></section>`;}
function renderCalendar(){
 const selected=selectedCalDate||todayISO();
 const date=dateObj(selected);const y=calCursor.getFullYear(),m=calCursor.getMonth();
 const modeButtons=[['month','Mes'],['week','Semana'],['day','Día'],['agenda','Agenda']].map(([v,l])=>`<button data-calendar-mode="${v}" class="${calendarMode===v?'active':''}">${l}</button>`).join('');
 let rangeStart=selected,rangeEnd=selected,heading='';
 if(calendarMode==='month'){rangeStart=dateISO(new Date(y,m,1));rangeEnd=dateISO(new Date(y,m+1,0));heading=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(calCursor);}
 else if(calendarMode==='week'){const monday=new Date(date);monday.setDate(date.getDate()-((date.getDay()+6)%7));rangeStart=dateISO(monday);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);rangeEnd=dateISO(sunday);heading=`Semana del ${fmtDate(rangeStart,{day:'numeric',month:'short'})} al ${fmtDate(rangeEnd,{day:'numeric',month:'short',year:'numeric'})}`;}
 else if(calendarMode==='day'){heading=fmtLong(selected);}
 else{rangeEnd=addDays(selected,29);heading=`Agenda · ${fmtDate(rangeStart)} – ${fmtDate(rangeEnd,{day:'numeric',month:'short',year:'numeric'})}`;}
 const items=calendarItems(rangeStart,rangeEnd);
 let body='';
 if(calendarMode==='month'){
  const first=new Date(y,m,1),offset=(first.getDay()+6)%7,startDate=new Date(y,m,1-offset),days=Array.from({length:42},(_,i)=>{const d=new Date(startDate);d.setDate(startDate.getDate()+i);return d});
  const all=calendarItems(dateISO(days[0]),dateISO(days[41]));const wd=['L','M','X','J','V','S','D'];
  const dayItems=calendarItems(selected,selected);
  body=`<div class="calendar-layout"><section class="section-card calendar-card"><div class="calendar-toolbar"><div class="calendar-month">${heading.charAt(0).toUpperCase()+heading.slice(1)}</div><div class="inline"><button class="icon-btn" data-cal-move="-1" aria-label="Mes anterior">‹</button><button class="btn small" data-cal-today>Hoy</button><button class="icon-btn" data-cal-move="1" aria-label="Mes siguiente">›</button></div></div><div class="calendar-grid">${wd.map(x=>`<div class="cal-weekday">${x}</div>`).join('')}${days.map(d=>{const iso=dateISO(d),arr=all.filter(x=>x.date===iso),inMonth=d.getMonth()===m;return `<button class="cal-day ${inMonth?'':'muted'} ${iso===todayISO()?'today':''} ${iso===selected?'selected':''}" data-cal-day="${iso}"><div class="cal-num">${d.getDate()}</div><div class="cal-dots">${arr.slice(0,4).map(x=>`<i class="cal-dot ${x.type}" title="${esc(x.title)}"></i>`).join('')}</div>${arr.length?`<div class="cal-count">${arr.length} ${arr.length===1?'asunto':'asuntos'}</div>`:''}</button>`}).join('')}</div><div class="item-meta" style="margin-top:13px;gap:13px"><span class="inline"><i class="cal-dot event"></i> Eventos</span><span class="inline"><i class="cal-dot task"></i> Tareas</span><span class="inline"><i class="cal-dot follow"></i> Revisiones</span></div></section><section class="section-card"><div class="day-list-title">${fmtLong(selected)}</div><div class="day-list-date">${dayItems.length} elementos programados</div><div class="stack day-list">${dayItems.length?dayItems.map(calendarEntry).join(''):empty('Día sin elementos','Añade una fecha límite, reunión o recordatorio para este día.','▦','<button class="btn small primary" data-add="event" data-prefill-date="'+selected+'">＋ Añadir al día</button>')}</div></section></div>`;
 }else if(calendarMode==='week'){
  const dates=Array.from({length:7},(_,i)=>addDays(rangeStart,i));
  body=`<div class="calendar-toolbar"><div class="calendar-month">${heading}</div><div class="inline"><button class="icon-btn" data-cal-move="-1" aria-label="Semana anterior">‹</button><button class="btn small" data-cal-today>Hoy</button><button class="icon-btn" data-cal-move="1" aria-label="Semana siguiente">›</button></div></div><div class="week-agenda">${dates.map(d=>calendarDayGroup(d,items,true)).join('')}</div>`;
 }else if(calendarMode==='day'){
  const dayItems=items.filter(x=>x.date===selected);
  body=`<div class="calendar-toolbar"><div class="calendar-month">${heading}</div><div class="inline"><button class="icon-btn" data-cal-move="-1" aria-label="Día anterior">‹</button><button class="btn small" data-cal-today>Hoy</button><button class="icon-btn" data-cal-move="1" aria-label="Día siguiente">›</button></div></div><section class="section-card calendar-day-detail"><div class="day-list-date">${dayItems.length} elementos programados</div><div class="stack day-list">${dayItems.length?dayItems.map(calendarEntry).join(''):empty('Día sin elementos','Añade una fecha límite, reunión o recordatorio para este día.','▦','<button class="btn small primary" data-add="event" data-prefill-date="'+selected+'">＋ Añadir al día</button>')}</div></section>`;
 }else{
  const groups=[...new Set(items.map(x=>x.date))];
  body=`<div class="calendar-toolbar"><div class="calendar-month">${heading}</div><div class="inline"><button class="icon-btn" data-cal-move="-1" aria-label="Periodo anterior">‹</button><button class="btn small" data-cal-today>Hoy</button><button class="icon-btn" data-cal-move="1" aria-label="Periodo siguiente">›</button></div></div><div class="agenda-list">${groups.length?groups.map(d=>calendarDayGroup(d,items)).join(''):empty('Agenda despejada','No hay elementos programados en los próximos 30 días desde la fecha seleccionada.','✓')}</div>`;
 }
 return `${pageHead('Planificación','Calendario','Cambia entre vista mensual, semanal, diaria y cronológica.','<button class="btn" data-add="task">＋ Tarea</button><button class="btn primary" data-add="event">＋ Evento</button>')}<section class="section-card calendar-main"><div class="calendar-top-controls"><div class="segmented calendar-modes">${modeButtons}</div><span class="section-note">${calendarMode==='month'?'Vista mensual':calendarMode==='week'?'Planificación semanal':calendarMode==='day'?'Agenda del día':'Próximos 30 días'}</span></div>${body}</section>`;
}
function renderNotes(){const arr=live('notes').sort((a,b)=>(b.pinned-a.pinned)||byUpdated(b,a));return `${pageHead('Memoria externa','Notas','Guarda información, ideas y contexto vinculado a tus áreas.','<button class="btn primary" data-add="note">＋ Nueva nota</button>')}<div class="filters"><input id="noteSearch" class="control filter-search" placeholder="Buscar en tus notas…"><select class="control" id="projectFilter"><option value="all">Todas las áreas</option>${S.projects.filter(p=>!p.deletedAt).map(p=>`<option value="${p.id}" ${projectFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="grid note-grid" id="noteGrid">${arr.length?arr.filter(n=>projectFilter==='all'||n.projectId===projectFilter).map(n=>`<article class="note-card" data-edit-note="${n.id}"><div class="inline" style="justify-content:space-between;width:100%"><div class="note-title">${esc(n.title||'Nota sin título')}</div>${n.pinned?'<span class="pill medium">Fijada</span>':''}</div><div class="note-preview">${esc(n.body||'Sin contenido')}</div><div class="note-foot">${projectPill(n.projectId)}<span>${fmtDate(n.updatedAt)}</span></div></article>`).join(''):empty('Aún no hay notas','Crea una nota para guardar una idea o información que no quieras perder.','▤','<button class="btn primary small" data-add="note">＋ Crear nota</button>')}</div>`;}
function renderAnalytics(){const tasks=visibleTasks(),done=tasks.filter(t=>t.status==='done'),open=tasks.filter(t=>t.status!=='done'),pct=tasks.length?Math.round(done.length/tasks.length*100):0;const last7=Array.from({length:7},(_,i)=>{const d=addDays(todayISO(),i-6);return {date:d,label:fmtDate(d,{day:'numeric',month:'short'}),n:done.filter(t=>(t.completedAt||t.updatedAt||'').slice(0,10)===d).length}});const byP=S.projects.filter(p=>!p.deletedAt).map(p=>({p,n:tasks.filter(t=>t.projectId===p.id).length}));const follow=visibleFollowups();const overdue=tasks.filter(isOverdue).length;return `${pageHead('Visión global','Estadísticas','Entiende tu carga de trabajo y detecta dónde se acumulan los asuntos.','<button class="btn" data-export>⇩ Exportar datos</button>')}<div class="grid stats-grid">${stat('Tareas totales',tasks.length,'Incluye completadas','☷','var(--info)')}${stat('Completadas',done.length,`${pct}% del total`,'✓','var(--ok)')}${stat('Abiertas',open.length,`${overdue} vencidas`,'◷','var(--warn)')}${stat('Seguimientos',follow.length,'Asuntos abiertos','◎','var(--vio)')}</div><div class="grid chart-grid"><section class="section-card"><div class="section-head"><div><h2 class="section-title">Actividad reciente</h2><div class="section-note">Tareas completadas por día · últimos siete días.</div></div></div><div class="chart-bars">${last7.map(x=>`<div class="bar-wrap"><div class="bar-val">${x.n||''}</div><div class="bar" style="height:${Math.max(2,x.n?Math.min(100,x.n*24):2)}%;--bar-color:var(--ok)"></div><div class="bar-label">${x.label}</div></div>`).join('')}</div></section><section class="section-card"><div class="section-head"><div><h2 class="section-title">Progreso global</h2><div class="section-note">Proporción de tareas finalizadas.</div></div></div><div class="ring-wrap"><div class="ring" style="--pct:${pct*3.6}deg"><div class="ring-center"><b>${pct}%</b><span>completado</span></div></div><div class="legend"><div class="legend-row"><i class="legend-dot" style="background:var(--ok)"></i>${done.length} completadas</div><div class="legend-row"><i class="legend-dot" style="background:var(--card2)"></i>${open.length} pendientes</div><div class="legend-row"><i class="legend-dot" style="background:var(--bad)"></i>${overdue} vencidas</div></div></div></section><section class="section-card"><div class="section-head"><div><h2 class="section-title">Distribución por área</h2><div class="section-note">Tareas registradas en cada espacio.</div></div></div><div class="stack">${byP.map(x=>`<div><div class="inline" style="justify-content:space-between;width:100%;font-size:11px"><b>${esc(x.p.name)}</b><span class="muted">${x.n}</span></div><div class="progress"><span style="width:${tasks.length?x.n/tasks.length*100:0}%;background:${x.p.color}"></span></div></div>`).join('')}</div></section><section class="section-card"><div class="section-head"><div><h2 class="section-title">Salud de los seguimientos</h2><div class="section-note">Qué asuntos necesitan más atención.</div></div></div><div class="stack"><div class="item-card"><div class="item-main"><div class="item-title">Revisiones atrasadas</div><div class="item-meta">Seguimientos cuya próxima revisión ya pasó.</div></div><b class="text-overdue">${follow.filter(reviewOverdue).length}</b></div><div class="item-card"><div class="item-main"><div class="item-title">Sin fecha de revisión</div><div class="item-meta">Asuntos abiertos sin próximo recordatorio.</div></div><b class="text-warn">${follow.filter(f=>!f.reviewDate).length}</b></div><div class="item-card"><div class="item-main"><div class="item-title">Antigüedad media</div><div class="item-meta">Días desde que se abrió cada asunto.</div></div><b>${follow.length?Math.round(follow.reduce((a,f)=>a+daysBetween(f.createdAt?.slice(0,10)||f.since||todayISO()),0)/follow.length):0} d</b></div></div></section></div>`;}

function renderSettings(){const s=S.settings;return `${pageHead('Personalización','Preferencias y datos','Configura el almacenamiento, la sincronización, los recordatorios y las copias de seguridad.')}<div class="grid setting-grid"><section class="section-card"><div class="section-head"><div><h2 class="section-title">Apariencia y experiencia</h2><div class="section-note">Ajusta NexoLab a tu forma de trabajar.</div></div></div><div class="setting-row"><div><div class="setting-title">Tema oscuro</div><div class="setting-desc">Alterna entre oscuro suave y claro.</div></div><button class="toggle ${s.theme==='dark'?'on':''}" data-toggle-theme></button></div><div class="setting-row"><div><div class="setting-title">Mostrar tareas completadas</div><div class="setting-desc">Mantenerlas visibles en listas y tableros.</div></div><button class="toggle ${s.showCompleted?'on':''}" data-setting-toggle="showCompleted"></button></div><div class="setting-row"><div><div class="setting-title">Nombre en el saludo</div><div class="setting-desc">Personaliza el panel principal.</div></div><input class="control" style="max-width:145px" id="settingName" value="${esc(s.name)}" placeholder="Tu nombre"></div></section>
<section class="section-card"><div class="section-head"><div><h2 class="section-title">Recordatorios</h2><div class="section-note">Avisos en este dispositivo cuando NexoLab esté activo.</div></div></div><div class="setting-row"><div><div class="setting-title">Notificaciones del navegador</div><div class="setting-desc">Solicita permiso para mostrar avisos del sistema. En iPhone, instala primero la app en la pantalla de inicio.</div></div><button class="btn small" id="enableNotifications">${notifyPermission()==='granted'?'Permiso concedido':notifyPermission()==='denied'?'Permiso bloqueado':notifyPermission()==='unsupported'?'No disponible':'Activar'}</button></div><div class="setting-row"><div><div class="setting-title">Avisos dentro de la aplicación</div><div class="setting-desc">Recordar vencimientos y revisiones al abrir la app.</div></div><button class="toggle ${s.notifyEnabled?'on':''}" data-setting-toggle="notifyEnabled"></button></div><p class="section-note" style="margin-top:10px">Limitación técnica: las notificaciones programadas cuando la web está cerrada requieren un servicio push adicional. Esta versión revisa los avisos mientras está abierta y al volver a abrirla.</p></section>
<section class="section-card"><div class="section-head"><div><h2 class="section-title">Google Drive</h2><div class="section-note">Sincroniza el archivo de datos entre tu iPhone y Windows.</div></div><span class="pill ${s.driveAuto&&driveToken?'low':'medium'}">${s.driveAuto?(driveToken?'Auto-sync activo':'Renovar acceso'):'No conectado'}</span></div><div class="field"><label>ID DE CLIENTE OAUTH (GOOGLE CLOUD)</label><input id="driveClientId" value="${esc(s.driveClientId)}" placeholder="xxx.apps.googleusercontent.com"><span class="hint">Se configura una vez en Google Cloud Console. Consulta la guía incluida en el paquete.</span></div><div class="setting-row" style="margin-top:12px"><div><div class="setting-title">Sincronización automática</div><div class="setting-desc">Sincroniza tras cambios y al volver a la aplicación cuando haya una sesión válida.</div></div><button class="toggle ${s.driveAuto?'on':''}" data-setting-toggle="driveAuto"></button></div><div class="inline" style="margin-top:13px;flex-wrap:wrap"><button class="btn primary" id="driveSync">☁ Conectar / sincronizar</button><button class="btn" id="driveDisconnect">Desconectar</button></div><div class="section-note" id="driveStatus" style="margin-top:9px">${s.lastDriveSync?'Última sincronización: '+fmtDate(s.lastDriveSync,{day:'numeric',month:'short',year:'numeric'})+' · '+fmtTime(s.lastDriveSync):'Todavía no se ha sincronizado.'}</div></section>
<section class="section-card"><div class="section-head"><div><h2 class="section-title">Copias de seguridad</h2><div class="section-note">Conserva una copia independiente de tus datos.</div></div></div><div class="stack"><div class="item-card"><div class="quick-ico">⇩</div><div class="item-main"><div class="item-title">Exportar copia completa</div><div class="item-meta">Descarga tareas, eventos, notas, seguimientos y configuración.</div></div><button class="btn small" data-export>Exportar</button></div><div class="item-card"><div class="quick-ico">⇧</div><div class="item-main"><div class="item-title">Restaurar desde una copia</div><div class="item-meta">Importa un archivo JSON anterior.</div></div><button class="btn small" id="importBtn">Importar</button></div><div class="item-card"><div class="quick-ico">▦</div><div class="item-main"><div class="item-title">Instalar en iPhone / escritorio</div><div class="item-meta">Añade NexoLab a la pantalla de inicio o instala la PWA desde el navegador.</div></div><button class="btn small" id="installHelp">Guía</button></div></div></section>
<section class="section-card"><div class="section-head"><div><h2 class="section-title">Datos y mantenimiento</h2><div class="section-note">Estado de tus registros locales.</div></div></div><div class="setting-row"><div><div class="setting-title">Tareas</div></div><b>${visibleTasks().length}</b></div><div class="setting-row"><div><div class="setting-title">Seguimientos</div></div><b>${visibleFollowups().length}</b></div><div class="setting-row"><div><div class="setting-title">Eventos</div></div><b>${visibleEvents().length}</b></div><div class="setting-row"><div><div class="setting-title">Notas</div></div><b>${live('notes').length}</b></div><button class="btn danger block" id="resetApp" style="margin-top:14px">Restablecer aplicación</button><p class="section-note" style="margin-top:7px">Esta acción elimina los datos locales. Exporta una copia antes de continuar.</p></section></div>`;}
let currentProjectId='work', currentArea='';
function projectOptions(selected){return S.projects.filter(p=>!p.deletedAt).map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('');}
function areaOptions(projectId,selected){const p=proj(projectId);return (p.areas||[]).map(a=>`<option value="${esc(a)}" ${selected===a?'selected':''}>${esc(a)}</option>`).join('');}
function modalOpen(title,sub,body){$('#modal').innerHTML=`<div class="modal-head"><div><div class="modal-title">${title}</div><div class="modal-sub">${sub||''}</div></div><button class="icon-btn" data-modal-close aria-label="Cerrar">×</button></div><div class="modal-body">${body}</div>`;$('#modalBackdrop').classList.add('open');setTimeout(()=>{$('#modal input:not([type=hidden]),#modal textarea,#modal select')?.focus({preventScroll:true});},80);}
function modalClose(){$('#modalBackdrop').classList.remove('open');$('#modal').innerHTML='';setTimeout(applyPendingServiceWorkerUpdate,80);}
function field(label,control,full=false,hint=''){return `<div class="field ${full?'full':''}"><label>${label}</label>${control}${hint?`<span class="hint">${hint}</span>`:''}</div>`;}
function textInput(name,value='',placeholder='',type='text',required=false){return `<input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required?'required':''}>`;}
function textarea(name,value='',placeholder='',rows=3){return `<textarea name="${name}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`;}
function selectInput(name,options,value){return `<select name="${name}">${options.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;}
function openAdd(type,prefill={}){const defaults={projectId:prefill.projectId||currentProjectId||'work',area:prefill.area||currentArea||'',date:prefill.date||todayISO()};if(type==='task')openTaskForm(null,defaults);else if(type==='follow')openFollowForm(null,defaults);else if(type==='event')openEventForm(null,defaults);else if(type==='note')openNoteForm(null,defaults);else if(type==='project')openProjectForm();}
function openTaskForm(id=null,defaults={}){const t=id?S.tasks.find(x=>x.id===id):null;const d={projectId:defaults.projectId||t?.projectId||'work',area:defaults.area||t?.area||'',...defaults};const row=t||{title:'',details:'',priority:'medium',status:'todo',dueDate:'',plannedDate:d.date||'',reminderAt:'',tags:[],checklist:[],projectId:d.projectId,area:d.area};modalOpen(t?'Editar tarea':'Nueva tarea','Una acción concreta que quieres completar.',`<form id="taskForm" data-id="${id||''}"><div class="form-grid">${field('TÍTULO',textInput('title',row.title,'¿Qué tienes que hacer?','text',true),true)}${field('ESPACIO',`<select name="projectId">${projectOptions(row.projectId)}</select>`)}${field('ÁREA / SUBPROYECTO',`<select name="area" id="taskArea"><option value="">Sin especificar</option>${areaOptions(row.projectId,row.area)}</select>`)}${field('PRIORIDAD',selectInput('priority',[{value:'high',label:'Alta'},{value:'medium',label:'Media'},{value:'low',label:'Baja'}],row.priority))}${field('ESTADO',selectInput('status',[{value:'todo',label:'Por hacer'},{value:'doing',label:'En curso'},{value:'done',label:'Completada'}],row.status))}${field('FECHA LÍMITE',textInput('dueDate',row.dueDate,'','date'))}${field('FECHA PREVISTA',textInput('plannedDate',row.plannedDate,'','date'),false,'Cuándo te gustaría realizarla.')}${field('RECORDATORIO',textInput('reminderAt',row.reminderAt?localDateTimeInput(row.reminderAt):'','', 'datetime-local'),false,'Se mostrará al abrir la app; notificación del sistema si está activa.')}${field('ETIQUETAS',textInput('tags',(row.tags||[]).join(', '),'Ej. cliente, urgente, informe'),true)}${field('DESCRIPCIÓN / CONTEXTO',textarea('details',row.details,'Información útil, próximos pasos, enlaces…',3),true)}${field('CHECKLIST (una línea por elemento)',textarea('checklist',(row.checklist||[]).map(c=>typeof c==='string'?c:c.text).join('\n'),'Ej. Revisar documentación\nEnviar informe\nConfirmar recepción',3),true)}</div><div class="modal-actions">${t?`<button type="button" class="btn danger small" data-delete="task:${id}">Eliminar</button>`:'<span class="section-note">Se guardará automáticamente.</span>'}<div class="modal-actions-right"><button type="button" class="btn" data-modal-close>Cancelar</button><button class="btn primary" type="submit">Guardar tarea</button></div></div></form>`);}
function openFollowForm(id=null,defaults={}){
 const f=id?S.followups.find(x=>x.id===id):null;

mpletar.</div></div><button class="link-btn" data-add="task">＋ Añadir</button></div><div class="stack">${tasks.length?tasks.slice(0,10).map(taskCard).join(''):empty('Sin tareas abiertas','No hay acciones pendientes en esta área.','✓','<button class="btn small primary" data-add="task">＋ Crear tarea</button>')}</div></section><section class="section-card"><div class="section-head"><div><h2 class="section-title">Próximos eventos</h2><div class="section-note">Reuniones, hitos y compromisos del espacio.</div></div><button class="link-btn" data-add="event">＋ Añadir</button></div><div class="stack">${areaE.filter(e=>eventDate(e)>=todayISO()).slice(0,6).map(eventCard).join('')||empty('Sin eventos próximos','Puedes registrar una reunión o una fecha de entrega.','▦')}</div></section></div><div class="grid" style="gap:14px"><section class="section-card"><div class="section-head"><div><h2 class="section-title">Seguimientos abiertos</h2><div class="section-note">Asuntos que requieren continuidad.</div></div><button class="link-btn" data-add="follow">＋ Añadir</button></div><div class="stack">${areaF.length?areaF.slice(0,6).map(followCard).join(''):empty('Sin seguimientos abiertos','Los asuntos en espera aparecerán aquí.','◷')}</div></section><section class="section-card"><div class="section-head"><div><h2 class="section-title">Notas del espacio</h2><div class="section-note">Información y contexto guardado.</div></div><button class="link-btn" data-add="note">＋ Añadir</button></div><div class="stack">${areaN.length?areaN.slice(0,5).map(n=>`<div class="item-card" data-edit-note="${n.id}"><div class="item-main"><div class="item-title">${esc(n.title)}</div><div class="item-meta">${fmtDate(n.updatedAt)}</div></div><button class="tiny-btn" data-edit-note="${n.id}">✎</button></div>`).join(''):empty('Sin notas','Guarda aquí decisiones, acuerdos o contexto.','▤')}</div></section></div></div>`;}

function exportData(){const payload={app:'nexolab',version:APP_VERSION,exportedAt:nowISO(),data:S};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`nexolab-copia-${todayISO()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);S.meta.lastBackup=nowISO();persist(false);toast('Copia de seguridad descargada','good');}
async function importData(file){try{const payload=JSON.parse(await file.text());const incoming=payload.data||payload;if(!incoming||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.events))throw new Error('El archivo no parece una copia de NexoLab.');const mode=confirm('¿Quieres REEMPLAZAR todos los datos actuales?\n\nAceptar: reemplazar los datos locales por la copia.\nCancelar: combinar la copia con los datos actuales.');if(mode){S=normalizeState(incoming);}else{S=mergeStates(S,incoming);}await forcePersist();render();toast('Copia importada correctamente','good');}catch(e){toast(e.message||'No se pudo importar la copia.','error');}}
function mergeRecords(a,b){const map=new Map();[...(a||[]),...(b||[])].forEach(r=>{const old=map.get(r.id);if(!old||byUpdated(r,old)>=0)map.set(r.id,r);});return [...map.values()];}
function mergeStates(local,remote){const out=normalizeState(local);for(const k of ['tasks','followups','events','notes','projects'])out[k]=mergeRecords(local[k],remote[k]);out.settings={...remote.settings,...local.settings};out.meta={...remote.meta,...local.meta};out.updatedAt=nowISO();return out;}
async function forcePersist(){clearTimeout(saveTimer);try{const db=await openDB();if(db)await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put({id:'state',value:S});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});else localStorage.setItem('nexolab-state',JSON.stringify(S));updateStorageStatus();}catch(e){console.error(e);}}
function updateThemeFromSettings(){document.documentElement.dataset.theme=S.settings.theme||'dark';const meta=$('meta[name="theme-color"]');if(meta)meta.content=S.settings.theme==='dark'?'#101D18':'#F3F5EF';$('#themeBtn').textContent=S.settings.theme==='dark'?'☼':'☾';}
function notifyPermission(){return ('Notification' in window)?Notification.permission:'unsupported';}
async function enableNotifications(){if(!('Notification'in window)){toast('Este navegador no admite notificaciones.','error');return;}try{const p=await Notification.requestPermission();if(p==='granted'){S.settings.notifyEnabled=true;persist(false);toast('Notificaciones activadas en este dispositivo.','good');scanReminders(true);}else toast('No se concedió permiso para notificaciones.','error');render();}catch(e){toast('No se pudo activar el permiso.','error');}}
async function sendNotice(title,body,tag){if(notifyPermission()!=='granted')return;try{if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.ready;await reg.showNotification(title,{body,tag,icon:'icon.svg',badge:'icon.svg',data:{url:'./'}});}else new Notification(title,{body,tag});}catch(e){console.warn('Notification failed',e);}}
async function scanReminders(force=false){if(!S.settings.notifyEnabled||notifyPermission()!=='granted')return;const day=todayISO();const now=Date.now();let changed=false;const overdue=visibleTasks().filter(t=>t.status!=='done'&&t.reminderAt&&Date.parse(t.reminderAt)<=now&&t.reminderSentFor!==t.reminderAt);for(const t of overdue.slice(0,3)){await sendNotice('NexoLab · Recordatorio',t.title,'task-'+t.id);t.reminderSentFor=t.reminderAt;t.updatedAt=nowISO();changed=true;}const review=visibleFollowups().filter(f=>f.reviewDate&&f.reviewDate<=day&&f.reviewNotifiedAt!==day);for(const f of review.slice(0,3)){await sendNotice('NexoLab · Seguimiento para revisar',f.title+(f.waitingFor?' · '+f.waitingFor:''),'follow-'+f.id);f.reviewNotifiedAt=day;f.updatedAt=nowISO();changed=true;}const events=expandEvents(todayISO(),addDays(todayISO(),60)).filter(e=>e.reminder>0&&e.start&&Date.parse(e.start)-e.reminder*60000<=now&&Date.parse(e.start)>now);for(const occurrence of events.slice(0,3)){const e=S.events.find(x=>x.id===occurrence.id);if(!e||e.reminderNotifiedFor===occurrence.start)continue;await sendNotice('NexoLab · Próximo evento',e.title+' · '+fmtTime(occurrence.start),'event-'+e.id);e.reminderNotifiedFor=occurrence.start;e.updatedAt=nowISO();changed=true;}if(changed)persist(false);if(force){const n=overdue.length+review.length+events.length;if(!n)toast('No hay recordatorios pendientes.','good');}}

function installInstructions(){modalOpen('Instalar NexoLab','La instalación mejora el acceso y permite solicitar notificaciones en iPhone.',`<div class="stack"><div class="item-card"><div class="quick-ico"></div><div class="item-main"><div class="item-title">iPhone · Safari</div><div class="follow-details">1. Abre NexoLab desde su dirección HTTPS en Safari.<br>2. Pulsa el botón Compartir.<br>3. Selecciona «Añadir a pantalla de inicio».<br>4. Abre NexoLab desde el nuevo icono. Desde ahí podrás conceder permiso a las notificaciones.</div></div></div><div class="item-card"><div class="quick-ico">▣</div><div class="item-main"><div class="item-title">Windows · Chrome / Edge</div><div class="follow-details">Abre la web publicada y utiliza el icono de instalación que aparece en la barra de direcciones o el menú del navegador → «Instalar NexoLab».</div></div></div><p class="section-note">Para que funcione la instalación PWA, NexoLab debe estar publicado en una dirección HTTPS (por ejemplo, GitHub Pages). Abrir index.html directamente no activa el modo PWA ni los service workers.</p></div><div class="modal-actions"><span></span><button class="btn primary" data-modal-close>Entendido</button></div>`);}

/* Google Drive · OAuth de navegador con permiso drive.file (solo archivos creados por NexoLab). */
function loadGIS(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2)return resolve();const existing=$('script[data-gis]');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return;}const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.dataset.gis='1';s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar el servicio de inicio de sesión de Google.'));document.head.append(s);});}
async function requestDriveToken(){const clientId=S.settings.driveClientId?.trim();if(!clientId)throw new Error('Primero introduce el ID de cliente OAuth de Google Cloud.');if(location.protocol==='file:')throw new Error('Google Drive requiere abrir NexoLab desde una dirección HTTPS publicada.');await loadGIS();return new Promise((resolve,reject)=>{try{const client=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error){reject(new Error(r.error_description||r.error));return;}driveToken=r.access_token;driveTokenExp=Date.now()+(r.expires_in||3600)*1000;resolve(driveToken);},error_callback:e=>reject(new Error(e?.message||'No se pudo completar el inicio de sesión con Google.'))});client.requestAccessToken({prompt:''});}catch(e){reject(e);}});}
async function driveFetch(url,opts={}){if(!driveToken||Date.now()>driveTokenExp-15000)throw new Error('La sesión de Google ha caducado. Pulsa «Conectar / sincronizar».');const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+driveToken}});if(!r.ok){const msg=await r.text().catch(()=> '');throw new Error(`Google Drive respondió ${r.status}. ${msg.slice(0,120)}`);}return r;}
async function driveSync(interactive=true){if(driveBusy)return;driveBusy=true;const status=$('#driveStatus');if(status)status.textContent='Conectando con Google Drive…';try{if(!driveToken||Date.now()>driveTokenExp-15000){if(!interactive)throw new Error('La sesión de Google ha caducado; sincroniza manualmente.');await requestDriveToken();}const folderQ=encodeURIComponent("name='NexoLab' and mimeType='application/vnd.google-apps.folder' and trashed=false");const folders=await(await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${folderQ}&spaces=drive&fields=files(id,name)`)).json();driveFolderId=folders.files?.[0]?.id||null;if(!driveFolderId){const made=await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'NexoLab',mimeType:'application/vnd.google-apps.folder'})});driveFolderId=(await made.json()).id;}const q=encodeURIComponent(`name='nexolab-datos.json' and '${driveFolderId}' in parents and trashed=false`);const list=await(await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime)`)).json();const file=(list.files||[])[0]||null;driveFileId=file?.id||null;
if(file){const remote=await(await driveFetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`)).json();const remoteData=remote.data||remote;if(remoteData.tasks&&remoteData.events)S=mergeStates(S,remoteData);}
const body=JSON.stringify({app:'nexolab',version:APP_VERSION,exportedAt:nowISO(),data:S});let result;
if(driveFileId){result=await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media&fields=id,modifiedTime`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});}
else{const boundary='nexolab_'+uid().replaceAll('-','');const metadata={name:'nexolab-datos.json',mimeType:'application/json',description:'Datos personales de NexoLab',parents:[driveFolderId]};const multipart=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;result=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${boundary}`},body:multipart});const j=await result.json();driveFileId=j.id;}
S.settings.lastDriveSync=nowISO();S.settings.driveAuto=true;await forcePersist();if(status)status.textContent='Sincronizado · '+fmtDate(S.settings.lastDriveSync,{day:'numeric',month:'short',year:'numeric'})+' · '+fmtTime(S.settings.lastDriveSync);toast('NexoLab sincronizado con Google Drive.','good');if(currentView==='settings')render();
}catch(e){console.error(e);if(status)status.textContent=e.message;toast(e.message||'No se pudo sincronizar con Drive.','error');}finally{driveBusy=false;}}
let driveSyncTimer=null;function scheduleDriveSync(){if(!S.settings.driveAuto||!driveToken||Date.now()>driveTokenExp-15000)return;clearTimeout(driveSyncTimer);driveSyncTimer=setTimeout(()=>driveSync(false),1800);}
function disconnectDrive(){driveToken=null;driveTokenExp=0;driveFileId=null;S.settings.driveAuto=false;persist(false);toast('Sincronización automática pausada.','good');render();}

async function resetAppData(){try{const db=await openDB();if(db)await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});localStorage.removeItem('nexolab-state');S=initialState();driveToken=null;driveTokenExp=0;driveFileId=null;await forcePersist();setView('dashboard');toast('Aplicación restablecida.','good');}catch(e){toast('No se pudo restablecer la aplicación.','error');}}
function bindSettings(){const name=$('#settingName');if(name)name.addEventListener('change',()=>{S.settings.name=name.value.trim();persist();});const client=$('#driveClientId');if(client)client.addEventListener('change',()=>{S.settings.driveClientId=client.value.trim();persist(false);});}

function searchAll(q){const n=q.trim().toLocaleLowerCase('es');if(!n)return[];const results=[];visibleTasks().forEach(t=>{if((t.title+' '+t.details+' '+t.area+' '+proj(t.projectId).name).toLocaleLowerCase('es').includes(n))results.push({type:'task',id:t.id,title:t.title,sub:'Tarea · '+proj(t.projectId).short,icon:'☷'});});visibleFollowups().forEach(f=>{if((f.title+' '+f.details+' '+f.waitingFor+' '+f.area).toLocaleLowerCase('es').includes(n))results.push({type:'follow',id:f.id,title:f.title,sub:'Seguimiento · '+proj(f.projectId).short,icon:'◷'});});visibleEvents().forEach(e=>{if((e.title+' '+e.details+' '+e.location+' '+e.area).toLocaleLowerCase('es').includes(n))results.push({type:'event',id:e.id,title:e.title,sub:'Evento · '+proj(e.projectId).short,icon:'▦'});});live('notes').forEach(x=>{if((x.title+' '+x.body+' '+x.area).toLocaleLowerCase('es').includes(n))results.push({type:'note',id:x.id,title:x.title,sub:'Nota · '+proj(x.projectId).short,icon:'▤'});});return results.slice(0,10);}
function showSearch(q){const el=$('#searchResults');if(!q.trim()){el.classList.remove('open');return;}const r=searchAll(q);el.innerHTML=r.length?r.map(x=>`<button class="search-result" data-search-type="${x.type}" data-search-id="${x.id}"><span>${x.icon}</span><span class="item-main"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></span></button>`).join(''):empty('Sin resultados','Prueba con otro término.','⌕');el.classList.add('open');}
function openSearchResult(type,id){if(type==='task')openTaskForm(id);if(type==='follow')openFollowForm(id);if(type==='event')openEventForm(id);if(type==='note')openNoteForm(id);$('#searchResults').classList.remove('open');$('#globalSearch').value='';}
function filterTasksInDom(){const q=($('#taskSearch')?.value||'').toLocaleLowerCase('es');$$('[data-task-card]').forEach(el=>{const t=S.tasks.find(x=>x.id===el.dataset.taskCard);el.style.display=!q||(t&&(t.title+' '+t.details+' '+t.area).toLocaleLowerCase('es').includes(q))?'':'none';});}
function filterFollowInDom(){const q=($('#followSearch')?.value||'').toLocaleLowerCase('es'),kind=$('#followKind')?.value||'all';$$('.followup-card').forEach(el=>{const id=el.querySelector('[data-edit-follow]')?.dataset.editFollow;const f=S.followups.find(x=>x.id===id)||visibleFollowups().find(x=>x.title===el.querySelector('.item-title')?.textContent);const okq=!q||!!(f&&(f.title+' '+f.details+' '+f.waitingFor).toLocaleLowerCase('es').includes(q));el.style.display=okq&&(kind==='all'||f?.kind===kind)?'':'none';});}

/* PWA UPDATE FLOW
   - Mantiene el mismo start_url y el mismo ámbito instalado en iPhone.
   - Comprueba version.json al abrir, al volver al primer plano y cada 10 minutos.
   - Comprueba además el service worker sin usar la caché HTTP.
   - Aplica la actualización automáticamente cuando no hay un formulario en edición.
   - Los datos siguen en la misma base IndexedDB (nexolab-db), sin borrarlos.
*/
let pendingServiceWorkerReload=false;
let appReloadScheduled=false;
async function applyPendingServiceWorkerUpdate(){
 if(!pendingServiceWorkerReload||appReloadScheduled||document.visibilityState==='hidden')return;
 const modalOpen=$('#modalBackdrop')?.classList.contains('open');
 const active=document.activeElement;
 const editing=active&&(/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName))&&active.id!=='globalSearch';
 if(modalOpen||editing)return;
 pendingServiceWorkerReload=false;
 appReloadScheduled=true;
 try{await forcePersist();}catch(error){console.warn('No se pudo forzar el guardado antes de actualizar:',error);}
 location.reload();
}
function queueAppUpdate(message='Nueva versión disponible. Actualizando NexoLab…'){
 pendingServiceWorkerReload=true;
 if($('#modalBackdrop')?.classList.contains('open'))toast('Nueva versión descargada. Se aplicará al cerrar la edición.','good');
 else toast(message,'good');
 applyPendingServiceWorkerUpdate();
}
async function checkAppBuild(){
 try{
  const url=new URL('version.json',location.href);
  url.searchParams.set('check',String(Date.now()));
  const response=await fetch(url.toString(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
  if(!response.ok)return;
  const remote=await response.json();
  if(remote?.version&&remote.version!==BUILD_VERSION)queueAppUpdate();
 }catch(error){console.debug('NexoLab version check skipped:',error);}
}
function setupServiceWorkerUpdates(){
 if(!('serviceWorker'in navigator)||location.protocol==='file:')return;
 const hadController=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(hadController)queueAppUpdate();
 });
 const checkAll=()=>{
  if(document.visibilityState!=='visible')return;
  checkAppBuild();
  if(window.nexoLabSWRegistration)window.nexoLabSWRegistration.update().catch(err=>console.debug('NexoLab SW update check:',err));
 };
 navigator.serviceWorker.register('sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>{
  window.nexoLabSWRegistration=reg;
  checkAll();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkAll();applyPendingServiceWorkerUpdate();}});
  window.addEventListener('focus',checkAll);
  window.setInterval(checkAll,10*60*1000);
 }).catch(err=>console.warn('No se pudo registrar el service worker:',err));
 document.addEventListener('focusout',()=>setTimeout(applyPendingServiceWorkerUpdate,100));
}
async function boot(){try{await loadState();updateThemeFromSettings();$('#topDate').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'numeric',month:'short'}).format(new Date());render();bindSettings();setupServiceWorkerUpdates();if(S.settings.notifyEnabled)scanReminders();setInterval(()=>scanReminders(),60000);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus();}if(e.key==='Escape')modalClose();});}catch(e){console.error(e);toast('No se pudo inicializar NexoLab.','error');}}
boot();
